<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section skin-section">
          <label class="label" for="skin-select">SKIN</label>
          <select id="skin-select">
            <option value="retro">Retro</option>
            <option value="neon">Neón</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="hs-gameover" class="hs-section hidden">
          <p id="hs-gameover-msg" class="hs-new-record hidden"></p>
          <form id="hs-name-form" class="hs-name-form hidden" autocomplete="off">
            <label for="hs-name-input" class="label">TU NOMBRE</label>
            <input id="hs-name-input" type="text" maxlength="12" placeholder="Anónimo" />
            <button type="submit" class="hs-btn hs-btn-primary">Guardar</button>
          </form>
          <div id="hs-gameover-table"></div>
          <p id="hs-gameover-bests" class="hs-bests"></p>
          <button type="button" class="hs-btn hs-btn-danger hs-reset-btn">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- ---- Pause menu ---- -->
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button id="pause-resume-btn" class="pause-btn primary" type="button">Reanudar</button>
        <button id="pause-restart-btn" class="pause-btn" type="button">Reiniciar</button>
        <button id="pause-controls-btn" class="pause-btn" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls" hidden>
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="pause-level" for="start-level">
          Nivel inicial
          <select id="start-level"></select>
        </label>
        <p class="pause-hint">Se aplica en la próxima partida</p>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box hs-section">
        <p class="hs-title">TETRIS</p>
        <p class="label">RÉCORDS</p>
        <div id="hs-start-table"></div>
        <p id="hs-start-bests" class="hs-bests"></p>
        <button type="button" id="hs-play-btn" class="hs-btn hs-btn-primary hs-btn-big">Jugar</button>
        <button type="button" class="hs-btn hs-btn-danger hs-reset-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
